version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bhoomi_postgres
    restart: always
    environment:
      POSTGRES_USER: bhoomi
      POSTGRES_PASSWORD: bhoomipass123
      POSTGRES_DB: bhoomiverify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhoomi -d bhoomiverify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bhoomi_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhoomi_backend
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: bhoomi
      POSTGRES_PASSWORD: bhoomipass123
      POSTGRES_DB: bhoomiverify_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: bhoomi-super-secret-key-change-in-prod-2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python scripts/seed_demo_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bhoomi_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
